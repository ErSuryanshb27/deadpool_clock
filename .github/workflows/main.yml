name: Build Deadpool APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Buildozer (Fast Rebuilds)
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-kivy230-cache-v2

      - name: Install All Linux, SDL2 & Android Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake libltdl-dev lld libstdc++6 libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip "setuptools<70.0.0" wheel
          pip install cython==0.29.36 buildozer

      - name: Patch buildozer.spec for Kivy 2.3.0 & Build APK
        run: |
          # Pin Kivy 2.3.0 + pyjnius 1.6.1 + p4a develop branch so Kivy compilation never fails
          sed -i 's/requirements = .*/requirements = python3,kivy==2.3.0,pyjnius==1.6.1,plyer/g' buildozer.spec
          if ! grep -q "p4a.branch" buildozer.spec; then
            sed -i '/\[app\]/a p4a.branch = develop' buildozer.spec
          fi
          yes | buildozer -v android debug

      - name: Upload Deadpool APK
        uses: actions/upload-artifact@v4
        with:
          name: Deadpool-Clock-APK
          path: bin/*.apk
