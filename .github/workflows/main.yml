name: Build Deadpool APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Buildozer (Saves 18 minutes on rebuilds!)
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-cache-v1

      - name: Install All Linux & Android Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake libltdl-dev lld libstdc++6

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip "setuptools<70.0.0" wheel
          pip install cython==0.29.33 buildozer

      - name: Patch buildozer.spec & Build APK
        run: |
          # Ensure p4a branch is set to master/develop to avoid old Python compilation bugs
          if ! grep -q "p4a.branch" buildozer.spec; then
            echo "p4a.branch = develop" >> buildozer.spec
          fi
          yes | buildozer -v android debug

      - name: Upload Deadpool APK
        uses: actions/upload-artifact@v4
        with:
          name: Deadpool-Clock-APK
          path: bin/*.apk
