name: Build Deadpool APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Buildozer (Clean v3 Cache)
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-kivy230-py311-v3

      - name: Install All Linux, SDL2 & Android Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake libltdl-dev lld libstdc++6 libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip "setuptools<70.0.0" wheel
          pip install "cython<3.0.0" buildozer

      - name: Patch buildozer.spec for Stable Python 3.11 & Build APK
        run: |
          # Remove manual pyjnius pin so p4a uses its internal recipe
          sed -i 's/requirements = .*/requirements = python3,kivy==2.3.0,plyer/g' buildozer.spec
          # Remove any old p4a.branch lines and lock to stable release-2024.01.21 (Python 3.11)
          sed -i '/p4a.branch/d' buildozer.spec
          sed -i '/\[app\]/a p4a.branch = release-2024.01.21' buildozer.spec
          yes | buildozer -v android debug

      - name: Upload Deadpool APK
        uses: actions/upload-artifact@v4
        with:
          name: Deadpool-Clock-APK
          path: bin/*.apk
